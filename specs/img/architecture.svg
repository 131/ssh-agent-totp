<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#24342f">
<title>ssh-agent-totp: how it fits together</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f6357"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#12322a" flood-opacity=".14"/></filter></defs>
<style>.zone{fill:#f7f9f6;stroke:#d3ddd1;stroke-width:1.2}.zt{font-size:13px;font-weight:700;fill:#1b4332}.zs{font-size:11px;fill:#77867d}.box{fill:#fff;stroke:#cfd9cc;stroke-width:1.2}.hero{fill:#fff;stroke:#24533c;stroke-width:1.8}.t{font-size:12.5px;font-weight:700}.s{font-size:11px;fill:#6b7a6f}.m{font-family:Consolas,ui-monospace,monospace;font-size:11px;fill:#3f5347}.l{stroke:#4f6357;stroke-width:1.4;fill:none}.d{stroke-dasharray:4 3}</style>
<rect class="zone" x="16" y="16" width="560" height="388" rx="10"/><text class="zt" x="32" y="40">Your Windows session</text><text class="zs" x="32" y="56">offline: nothing leaves the machine but the update check</text>
<rect class="zone" x="596" y="16" width="248" height="388" rx="10"/><text class="zt" x="612" y="40">GitHub</text><text class="zs" x="612" y="56">131/ssh-agent-totp</text>
<g filter="url(#sh)"><rect class="box" x="36" y="80" width="200" height="86" rx="8"/></g><text class="t" x="50" y="104">SSH agent</text><text class="s" x="50" y="122">Pageant (0.75+) or OpenSSH agent</text><text class="s" x="50" y="138">your key never leaves it;</text><text class="s" x="50" y="154">it only signs a challenge</text>
<g filter="url(#sh)"><rect class="hero" x="306" y="80" width="250" height="150" rx="8"/></g>
<g transform="translate(320 94) scale(0.6875)"><rect width="32" height="32" rx="7" fill="#111"/><path d="M12.5 9V6.5a3.5 3.5 0 0 1 7 0V9" fill="none" stroke="#f5c518" stroke-width="2.4"/><circle cx="16" cy="19" r="9" fill="#f5c518"/><path d="M16 13.5V19l3.5 2.5" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"/></g>
<text class="t" x="350" y="110">ssh-agent-totp</text><text class="s" x="320" y="134">window + tray icon, WebView2</text>
<rect x="320" y="146" width="222" height="34" rx="5" fill="#fbf6dc" stroke="#e8d991"/><text class="t" x="332" y="167" font-size="11.5">ssh-agent-crypt</text><text class="s" x="430" y="167">seal / unseal</text>
<text class="s" x="320" y="200">tokens in memory, RFC 6238 codes</text><text class="s" x="320" y="216">click = copy (out of clipboard history)</text>
<path class="l" d="M236 123H306" marker-start="url(#arr)" marker-end="url(#arr)"/><text class="s" x="246" y="116">sign</text>
<g filter="url(#sh)"><rect class="box" x="36" y="262" width="250" height="122" rx="8"/></g><text class="t" x="50" y="286">%APPDATA%\ssh-agent-totp\</text>
<text class="m" x="50" y="310">tokens.crypt</text><text class="s" x="140" y="310">otpauth lines, sealed</text><text class="m" x="50" y="328">tokens.crypt.bak</text><text class="s" x="166" y="328">previous version</text><text class="m" x="50" y="346">settings.yml</text><text class="s" x="134" y="346">preferences, clear</text>
<text class="s" x="50" y="370">by hand: ssh-agent-crypt -decrypt</text>
<path class="l" d="M380 230V300H286" marker-end="url(#arr)"/><text class="s" x="404" y="262">read / write</text>
<g filter="url(#sh)"><rect class="box" x="406" y="300" width="150" height="56" rx="8"/></g><text class="t" x="420" y="322">Clipboard</text><text class="s" x="420" y="340">one code, paste it</text><path class="l" d="M480 230V300" marker-end="url(#arr)"/>
<g filter="url(#sh)"><rect class="box" x="616" y="80" width="208" height="70" rx="8"/></g><text class="m" x="630" y="104">manifest.json</text><text class="s" x="630" y="122">channel → tag</text><text class="m" x="630" y="140" style="font-size:10px">{"production":"v0.1.0"}</text>
<g filter="url(#sh)"><rect class="box" x="616" y="172" width="208" height="86" rx="8"/></g><text class="t" x="630" y="196">Releases</text><text class="m" x="630" y="214" style="font-size:9.5px" textLength="178" lengthAdjust="spacingAndGlyphs">ssh-agent-totp-windows-amd64.exe</text><text class="m" x="630" y="230" style="font-size:10px">SHA256SUMS</text><text class="s" x="630" y="248">Authenticode signed</text>
<g filter="url(#sh)"><rect class="box" x="616" y="282" width="208" height="102" rx="8"/></g><text class="t" x="630" y="306">Publishing</text><text class="m" x="630" y="326" style="font-size:10.5px">ppackage version patch</text><text class="s" x="630" y="344">tag → workflow (environment</text><text class="s" x="630" y="360">production, SIGNING_SERVER)</text><text class="s" x="630" y="376">→ GoReleaser → signed release</text>
<path class="l" d="M720 282V258" marker-end="url(#arr)"/>
<path class="l d" d="M556 110H616" marker-end="url(#arr)"/><path class="l d" d="M556 200H616" marker-end="url(#arr)"/><text class="s" x="562" y="104">check</text><text class="s" x="562" y="194">update</text>
</svg>
