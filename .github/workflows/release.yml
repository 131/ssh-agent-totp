name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go vet ./... && go test ./... && GOOS=windows go vet ./...
      - uses: actions/checkout@v4
        with:
          repository: 131/gh-actions
          ref: v1
          path: .gh-actions
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_SERVER: ${{ secrets.SIGNING_SERVER }}
      # Wails update manifest of the signed asset; promoting a channel commits
      # it as updates/<channel>.json (specs/RELEASES.md).
      - run: |
          CGO_ENABLED=0 go run github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0 updater manifest \
            -version "$GITHUB_REF_NAME" \
            -url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            -output dist/update.json dist/ssh-agent-totp-windows-amd64.exe
          gh release upload "$GITHUB_REF_NAME" dist/update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
