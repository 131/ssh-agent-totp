name: test
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners ship Git with core.autocrlf=true, which would turn LF sources into CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-H windowsgui" -o ssh-agent-totp.exe .
        if: runner.os == 'Windows'

      - name: Test patched WebView2 lifecycle
        if: runner.os == 'Windows'
        working-directory: third_party/go-webview2
        run: go vet -unsafeptr=false ./...; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; go test ./...
      - name: Ensure WebView2 runtime for native integration
        if: runner.os == 'Windows'
        run: ./scripts/ensure-webview2.ps1
      - name: Verify native WindowSession bridge
        if: runner.os == 'Windows'
        env:
          SSH_AGENT_TOTP_NATIVE_TESTS: '1'
        run: go test -v -run '^TestNativeSessionBridge$' .
      - name: Verify browser process teardown and recreation
        if: runner.os == 'Windows'
        run: ./scripts/test-webview-lifecycle.ps1 -Executable ./ssh-agent-totp.exe
