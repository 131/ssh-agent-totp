name: test
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners ship Git with core.autocrlf=true, which would turn LF sources into CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - run: gofmt -l . && test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-H windowsgui" -o ssh-agent-totp.exe .
        if: runner.os == 'Windows'

      - name: Ensure WebView2 runtime for native integration
        if: runner.os == 'Windows'
        run: ./scripts/ensure-webview2.ps1
      - name: Verify browser process teardown and recreation
        if: runner.os == 'Windows'
        run: ./scripts/test-webview-lifecycle.ps1 -Executable ./ssh-agent-totp.exe
