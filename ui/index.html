<!doctype html>
<html lang="{{html.lang}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>ssh-agent-totp</title><link rel="stylesheet" href="style.css"></head>
<body><header id="titlebar"><span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#111"/><path d="M12.5 9V6.5a3.5 3.5 0 0 1 7 0V9" fill="none" stroke="#f5c518" stroke-width="2.4"/><circle cx="16" cy="19" r="9" fill="#f5c518"/><path d="M16 13.5V19l3.5 2.5" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"/></svg>ssh-agent-totp<small id="version"></small></span><button id="settings-button" type="button" class="tool" title="{{settings}}" aria-label="{{settings}}"></button><span class="drag"></span><span class="header-tools"><button id="import-button" type="button" class="tool" title="{{add}}" aria-label="{{add}}"></button><button id="edit-button" type="button" class="tool" title="{{edit}}" aria-label="{{edit}}"></button></span><span class="window-tools"><button id="minimize-window" type="button" title="{{window.minimize}}" aria-label="{{window.minimize}}"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button><button id="close-window" type="button" title="{{window.close}}" aria-label="{{window.close}}"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button></span></header>
<main><section id="lock" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#111"/><path d="M11 15v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#f5c518" stroke-width="2.4"/><rect x="8" y="15" width="16" height="11" rx="2" fill="#f5c518"/></svg><h2>{{lock.title}}</h2><p id="lock-text" class="muted"></p><button id="retry" type="button">{{retry}}</button></section>
<section id="tokens" hidden><div class="toolbar"><input id="search" type="search" placeholder="{{search.placeholder}}" aria-label="{{search}}" spellcheck="false" autocomplete="off"></div><div id="list"></div></section></main>
<footer><span id="path" title=""></span></footer>
<dialog id="settings"><div class="settings-body"><div class="section-head"><h2>{{settings}}</h2><button type="button" id="close-settings" class="icon" aria-label="{{close}}">×</button></div><label class="setting">{{language}}<select id="language"></select></label><label class="setting">{{startup.launch}}<input id="launch-startup" class="switch" type="checkbox" role="switch" disabled></label><h3>{{tokens.title}}</h3><label class="setting">{{tokens.key}}<select id="key" class="key-select"></select></label><dl><dt>{{tokens.file}}</dt><dd id="file" class="path"></dd></dl><p class="muted">{{tokens.key.help}}</p><h3>{{updates}}</h3><label class="setting">{{update.enable}}<input id="update-enable" class="switch" type="checkbox" role="switch"></label><p id="update-disabled" class="muted" hidden>{{update.disabled.ui}}</p><p id="update-error" class="muted error" hidden></p><div id="update-fields"><label class="setting">{{channel}}<select id="channel"></select></label><dl><dt>{{version}}</dt><dd id="current-version"></dd><dt>{{update.latest}}</dt><dd id="latest-version">—</dd><dt>{{update.upstream}}</dt><dd id="upstream">—</dd></dl><p id="update-dev" class="muted" hidden>{{update.dev}}</p><div class="actions"><button id="check-update" type="button" class="secondary">{{update.check}}</button><button id="open-release" type="button" hidden></button></div></div></div></dialog>
<dialog id="import"><div class="section-head"><nav class="tabs"><button type="button" data-tab="add">{{tab.add}}</button><button type="button" data-tab="batch">{{tab.batch}}</button><span class="grow"></span><button type="button" data-tab="export">{{export}}</button></nav><button type="button" id="close-import" class="icon" aria-label="{{close}}">×</button></div><form id="add-form" class="pane" data-pane="add"><label>{{rename.issuer}}<input id="add-issuer" autocomplete="off" spellcheck="false" placeholder="Azure/fleurent"></label><label>{{rename.account}}<input id="add-account" autocomplete="off" spellcheck="false"></label><label>{{add.secret}}<input id="add-secret" class="mono" autocomplete="off" spellcheck="false" required placeholder="JBSW Y3DP EHPK 3PXP"></label><div class="row"><label>{{add.algorithm}}<select id="add-algorithm"><option>SHA1</option><option>SHA256</option><option>SHA512</option></select></label><label>{{add.digits}}<select id="add-digits"><option>6</option><option>7</option><option>8</option></select></label><label>{{add.period}}<input id="add-period" type="number" min="1" max="3600" value="30" required></label></div><p class="muted">{{rename.help}}</p><div class="actions"><button type="button" class="secondary cancel-import">{{cancel}}</button><button type="submit">{{add.submit}}</button></div></form><form id="import-form" class="pane" data-pane="batch"><textarea id="import-text" spellcheck="false" autocomplete="off" placeholder="{{import.placeholder}}"></textarea><p class="muted">{{import.help}}</p><div class="actions"><button type="button" class="secondary cancel-import">{{cancel}}</button><button type="submit">{{import.submit}}</button></div></form><div class="pane" data-pane="export"><p class="warning">{{export.warning}}</p><textarea id="export-text" class="masked" readonly spellcheck="false" title="{{copy}}"></textarea><div class="actions" id="export-tools"></div></div></dialog>
<dialog id="rename"><form id="rename-form"><div class="section-head"><h2 id="rename-title">{{rename}}</h2><button type="button" id="close-rename" class="icon" aria-label="{{close}}">×</button></div><label><span id="rename-issuer-label">{{rename.issuer}}</span><input id="rename-issuer" autocomplete="off" spellcheck="false" placeholder="Azure/fleurent"></label><label id="rename-account-label">{{rename.account}}<input id="rename-account" autocomplete="off" spellcheck="false"></label><p class="muted" id="rename-help">{{rename.help}}</p><div class="actions"><button type="button" id="cancel-rename" class="secondary">{{cancel}}</button><button type="submit">{{save}}</button></div></form></dialog>

<dialog id="confirm"><form method="dialog"><p id="confirm-message"></p><div class="actions"><button value="cancel" class="secondary">{{cancel}}</button><button value="ok" id="confirm-ok">{{confirm}}</button></div></form></dialog>
<div id="toasts" popover="manual" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
